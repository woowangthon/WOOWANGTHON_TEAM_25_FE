<!doctype html>
<html lang="ko">
  <meta charset="utf-8">
  <title>입금 안내와 개인정보 제외 확인</title>
  <section>
    <h1>출금 제한 해제 안내</h1>
    <button type="button">출금 신청</button>
    <p>출금하려면 5만 원을 먼저 입금하세요</p>
    <p>계좌번호: 123-456-789012</p>
    <p>고객센터 전화번호: 010-1234-5678</p>
    <p>전화번호: 0212345678, 계좌: 98765432101234</p>
    <p>전화번호: 123-4567</p>
    <p>계좌번호: 123456</p>
    <label>입력한 이름 <input value="입력한_비밀값_홍길동"></label>
    <textarea>입력한_비밀값_요청내용</textarea>
    <select><option selected>입력한_비밀값_은행</option></select>
    <div contenteditable="true">입력한_비밀값_메모</div>
    <div role="textbox">입력한_비밀값_사용자상담</div>
    <p hidden>숨겨진_별도입금_안내</p>
    <p style="position:absolute;top:10000px">화면밖_출금제한_안내</p>
  </section>
</html>
