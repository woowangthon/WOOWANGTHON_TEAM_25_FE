<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>우왕톤 사이트 관찰 합성 페이지</title></head>
<body><h1>합성 쇼핑몰 사이트 관찰 테스트</h1><p>판매대금에서 수수료를 차감한 뒤 지급합니다.</p><main id="fixture"></main>
<footer><p>상호: 합성상점 | 대표자: 홍길동</p><p>사업자등록번호: 123-45-67890</p></footer>
<script>
(() => {
  const requested = new URL(location.href).searchParams.get('type') || 'healthy';
  const modes = new Set(['healthy','menu-login','no-notice','stale-notice','no-reviews','empty-review','no-both','all']);
  const mode = modes.has(requested) ? requested : 'healthy';
  const date = value => new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(value);
  const today = date(new Date());
  const stale = date(new Date(Date.now() - 60*24*60*60*1000));
  const bits=[];
  if (mode==='menu-login'||mode==='all') bits.push('<nav><a href="site-login.html">출금 신청</a></nav>');
  if (!['no-notice','no-both','all'].includes(mode)) {
    const stamp=mode==='stale-notice'?stale:today;
    bits.push('<section id="notice"><h2>공지사항</h2><table><thead><tr><th>제목</th><th>작성일</th></tr></thead><tbody><tr><td><a href="#notice">서비스 안내</a></td><td class="td_datetime"><time datetime="'+stamp+'">'+stamp+'</time></td></tr></tbody></table></section>');
  }
  if (mode==='empty-review') bits.push('<section><h2>구매후기</h2><p>등록된 구매후기가 없습니다.</p></section>');
  else if (!['no-reviews','no-both','all'].includes(mode)) bits.push('<section id="reviews"><h2>구매후기</h2><ul class="review-list"><li class="review-item"><a href="#reviews">상품 구매 후기</a></li></ul></section>');
  document.querySelector('#fixture').innerHTML=bits.join('\n');
})();
</script></body></html>
