<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>우왕톤</title>
    <style>
      body {
        width: 340px;
        margin: 16px;
        font-family: system-ui, sans-serif;
        color: #222;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 20px;
      }

      h2 {
        margin: 20px 0 8px;
        font-size: 17px;
      }

      p {
        line-height: 1.5;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .result {
        margin-top: 10px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      .result h3 {
        margin: 0 0 6px;
        font-size: 14px;
      }

      .result p {
        margin: 4px 0;
        font-size: 13px;
      }

      .result .result-reason,
      .result-details {
        line-height: 1.6;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }

      .result .result-reason {
        white-space: pre-line;
      }

      .result .result-score {
        margin-top: 8px;
        font-weight: 600;
      }

      .result-details-title {
        margin: 8px 0 4px;
        font-size: 13px;
      }

      .result-details {
        margin: 0;
        padding-left: 18px;
        font-size: 13px;
      }

      .result-details li + li {
        margin-top: 4px;
      }

      .match { color: #176534; }
      .mismatch { color: #b42318; }
      .unknown { color: #755800; }
    </style>
  </head>
  <body>
    <h1>사업자정보 확인</h1>
    <p>사업자번호 <strong id="businessNumber">—</strong></p>
    <p>상호 <strong id="companyName">—</strong></p>
    <p>대표자 <strong id="representativeName">—</strong></p>
    <p id="status" role="status">페이지를 읽는 중…</p>

    <hr>

    <h2>검사 결과</h2>
    <div id="checkResults" aria-live="polite"></div>

    <script src="popup.js"></script>
  </body>
</html>
